# Every external version lives here (`catalogMode: strict`); package.json files
# use `catalog:`, `catalog:peers` or `workspace:*`. After an edit, run
# `vp install` and commit pnpm-lock.yaml.
packages:
  - packages/*
  - tests/*

catalogMode: strict

catalog:
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  # Pre-1.0, so exact. Its schemas follow one Stripe API version
  # (DISTILLED_API_VERSION); a bump also regenerates the Stripe resource
  # modules (`generate:resources`), and the tests fail until it does.
  "@distilled.cloud/stripe": 1.0.0-rc.20
  # Must equal the version @distilled.cloud/stripe pins, or two copies install.
  "@distilled.cloud/core": 1.0.0-rc.20
  # Exact: it depends on `effect ^<its version>`, which the singleton
  # override below must satisfy.
  "@effect/docgen": 4.1.5
  "@effect/language-service": ^0.87.5
  "@effect/platform-node": 4.1.5
  # Dev dependencies and optional peers of the sql package's testing subpaths.
  "@effect/sql-pg": 4.1.5
  "@effect/sql-sqlite-node": 4.1.5
  "@effect/vitest": 4.1.5
  # Patches the native `tsc` and vite-plus's oxlint / tsrs, and
  # fails `vp install` on any version it has no build for: read the
  # `components` table in node_modules/@effect/tsgo/dist/effect-tsgo.cjs
  # before moving it, `@typescript/native` or `vite-plus`.
  "@effect/tsgo": 0.73.4
  "@enfect/oxlint": ^0.10.0
  # Exact while pre-1.0; an optional peer of core's `./Authorization`.
  "@thomasfosterau/effect-auth": 0.8.0
  "@types/node": ^26.6.6
  "@vitest/coverage-istanbul": 5.1.1
  effect: 4.1.5
  fallow: 3.46.0
  # Only because @effect/docgen requires it as a peer.
  tsx: ^4.23.15
  # Dev only (an optional peer for the SDK-based webhook verifier's types).
  # Exact, at the release whose API version is DISTILLED_API_VERSION;
  # `tests/distilledApiVersion.test.ts` fails when they differ.
  stripe: 23.1.0
  # TypeScript 6 for JS-API consumers (docgen, tsdown's declaration bundler,
  # the language service); TypeScript 7 (`@typescript/native`, bin `tsc`) for
  # the type gate, at a version @effect/tsgo supports.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # `vite`, `vitest` and `@vitest/*` equal what vite-plus itself depends on
  # (`npm view vite-plus@<v> dependencies`); `vite` no longer equals vite-plus.
  vite-plus: 1.7.0
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vitest: 5.1.1

# Peer ranges the published packages declare: `^4.0.0` for `effect` unless a
# package's own dependencies require more.
catalogs:
  peers:
    effect: ^4.0.0
    # Optional: only the webhook verifier's types name it.
    stripe: ^23.1.0
    # Optional: only core's `./Authorization` imports it.
    "@thomasfosterau/effect-auth": ^0.2.0
    # Optional: only the sql package's testing subpaths import them.
    "@effect/sql-pg": ^4.0.0
    "@effect/sql-sqlite-node": ^4.0.0
  # The Stripe provider's floor: Distilled declares `effect: ^4.0.5`.
  distilled-peers:
    effect: ^4.0.5

overrides:
  # `effect` must be a singleton: two copies break Context / Layer / Schema identity.
  effect: "catalog:"
  vite@*: "catalog:"
  vitest@*: "catalog:"
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  fallow: true
# Agent skills dependencies ship (pnpm 12.11+). `fallow` ships `fallow` and
# `fallow-setup`; only `fallow` is linked, since the repository is already set
# up. Build grants stay in `allowBuilds`: a `permissions` entry without `build`
# leaves its package's `allowBuilds` grant in force.
permissions:
  fallow:
    skills: [fallow]
skills:
  dirs: [.claude/skills]
# Hold new versions for 24 hours (in minutes) before installing them.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@thomasfosterau/*"
