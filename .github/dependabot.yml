# Dependabot version-update configuration. Copied in shape from the
# effect-finance repository.
#
# `groups` collect dependencies that MUST move together, so a set never
# drifts apart across two PRs. Dependabot puts a dependency in the FIRST group
# that matches it, so the groups run specific → general and every broad
# pattern carries `exclude-patterns` for the sets above it.
#
# - `toolchain`: vite-plus pins the `oxlint`, `oxfmt`, `oxlint-tsgolint` and
#   `vitest` it carries, and `effect-tsgo patch` matches the native `tsc`
#   (@typescript/native) and vite-plus's `oxlint` / `oxlint-tsgolint` by
#   gitHead / version, failing `pnpm install` on any pairing it has no
#   artifact for. The Effect lint rules (@enfect/oxlint) load into that oxlint,
#   and fallow is the change-set audit. One PR moves them all; when it fails at
#   install, pick the @effect/tsgo release whose `components` table covers the
#   new oxlint / tsgolint by hand on that branch.
# - `distilled`: the three @distilled.cloud packages pin each other exactly.
#   A Distilled bump also regenerates the Stripe resource modules, which
#   Dependabot cannot do: finish the PR by hand (AGENTS.md, Common pitfalls).
#   The optional `stripe` SDK peer tracks Distilled's Stripe API version
#   (effect-finance#160), so it rides in this group; its majors and minors are
#   ignored below because they move only on a Distilled bump.
# - `effect`: the Effect 4 release line is a lockstep-versioned singleton set,
#   moved together with the consuming applications.
# - `docgen`: @effect/docgen runs its examples with `tsx`.
# - `changesets`: release tooling.
# - `minor-and-patch`: everything else that is not a major, in one PR.
#
# By hand, because Dependabot cannot move them (AGENTS.md lists them too):
# - the npm-alias catalog entries: `vite`
#   (`npm:@voidzero-dev/vite-plus-core@<v>`, must equal vite-plus; `pnpm exec
#   vp migrate` re-pins it, then drop the `minimumReleaseAgeExclude` entries
#   it adds), `typescript` (`npm:@typescript/typescript6@<v>`) and
#   `@typescript/native` (`npm:typescript@<v>`, a pairing @effect/tsgo
#   supports);
# - the `overrides` literals in pnpm-workspace.yaml (the `undici` security
#   floor; the `vite@*` / `vitest@*` / `effect` entries follow the catalog);
# - the Stripe resource modules after a `distilled` bump (regenerate them).
#
# `cooldown`: pnpm holds a new version for 8 hours (`minimumReleaseAge: 480`
# in pnpm-workspace.yaml). Dependabot's cooldown takes whole days only, so it
# is 1 day, longer than pnpm's wait: a Dependabot PR never proposes a version
# pnpm would still refuse. @thomasfosterau/* is exempt from both.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      toolchain:
        applies-to: version-updates
        patterns:
          - "vite-plus"
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "oxlint"
          - "oxfmt"
          - "oxlint-tsgolint"
          - "@effect/tsgo"
          - "@typescript/native"
          - "typescript"
          - "@typescript/typescript6"
          - "@enfect/oxlint"
          - "fallow"
      distilled:
        applies-to: version-updates
        patterns:
          - "@distilled.cloud/*"
          - "stripe"
      effect:
        applies-to: version-updates
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
          - "@effect/docgen"
      docgen:
        applies-to: version-updates
        patterns:
          - "@effect/docgen"
          - "tsx"
      changesets:
        applies-to: version-updates
        patterns:
          - "@changesets/*"
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "vite-plus"
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "oxlint"
          - "oxfmt"
          - "oxlint-tsgolint"
          - "@effect/*"
          - "@typescript/*"
          - "typescript"
          - "@enfect/oxlint"
          - "fallow"
          - "effect"
          - "tsx"
          - "@changesets/*"
          - "@distilled.cloud/*"
          - "stripe"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # The SDK is only an optional peer: its types serve the SDK-based
      # `./Webhook` verifier (`constructEvent*`), and no module loads it
      # (effect-finance#146). Its dev pin follows DISTILLED_API_VERSION
      # (effect-finance#160), so its majors and minors move by hand on a
      # Distilled bump (`tests/distilledApiVersion.test.ts` fails otherwise).
      # Scoped to the version-update types, so security updates stay enabled.
      - dependency-name: "stripe"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
