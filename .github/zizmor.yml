# `uvx zizmor --offline .github` should report nothing beyond what is configured here.
rules:
  dependabot-cooldown:
    config:
      days: 1
  artipacked:
    ignore:
      # The Changesets action pushes the version branch with the job-scoped token.
      - release.yml
  unpinned-uses:
    config:
      # Exact tags, locked to commits by .github/workflows/actions.lock.
      policies:
        "*": ref-pin
