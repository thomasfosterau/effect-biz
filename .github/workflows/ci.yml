name: CI

# ONE job, ONE required check: the pipeline's task graph lives in
# vite.config.ts (the root `check` and `docgen` tasks and every package's
# `test:unit` / `build`), not in GitHub Actions `needs:`. Copied in shape from
# the effect-finance repository.

on:
  pull_request:
    branches: [trunk]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [trunk]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

# No permissions by default; the single job grants only read access.
permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # A modest ceiling for every Node process in the pipeline. NODE_OPTIONS
      # is inherited by every child, including each vitest fork.
      NODE_OPTIONS: --max-old-space-size=2048
      VITEST_MAX_WORKERS: 2
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # Changesets compares against the base branch.
          fetch-depth: 0
      # Vite+ at the catalog's pin, the Node.js it manages (the newest LTS),
      # pnpm from package.json's `packageManager`, the pnpm store cache, and
      # `vp install --frozen-lockfile` (`vp` resolves the lockfile flag from CI).
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      - name: Restore the Vite+ task cache
        uses: actions/cache@v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-
      # Format + lint; lint is type-aware (oxlint-tsgolint), so it runs before
      # any build against the packages' `src/` (see the packages' tsconfig).
      - name: Format and lint
        run: vp check
      - name: Type gates
        run: vp run --concurrency-limit 2 check
      - name: Unit tests
        run: vp run -r test:unit
      - name: Build
        run: vp run -r build
      # Type-checks AND runs every JSDoc @example and README block against the built dist/.
      - name: Verify documentation examples (docgen)
        run: vp run docgen
      - name: Audit
        run: pnpm audit --audit-level high
