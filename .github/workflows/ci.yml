name: CI

# One job running `vp run ci`; the task graph lives in vite.config.ts, so a
# local `vp run ci` is the same pipeline.

on:
  pull_request:
  push:
    branches: [trunk]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

permissions: {}

jobs:
  ci:
    name: ci (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [lts, latest]
    env:
      # Inherited by every child process, each vitest fork included.
      NODE_OPTIONS: --max-old-space-size=2048
      VITEST_MAX_WORKERS: 2
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: ${{ matrix.node }}
          cache: true
          run-install: true
      - name: Restore the Vite+ task cache
        uses: actions/cache@v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-node-${{ matrix.node }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-node-${{ matrix.node }}-
      - name: Run CI
        run: vp run ci

  devcontainer:
    name: devcontainer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # `vp dlx` honours `minimumReleaseAge`: keep this at a release ≥24 hours old.
      DEVCONTAINER_CLI: "@devcontainers/cli@0.89.0"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Only to run the CLI on the runner; the container brings its own.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          run-install: false
      - name: Build and start the container
        run: vp dlx "$DEVCONTAINER_CLI" up --workspace-folder .
      - name: Check Vite+ inside the container
        run: vp dlx "$DEVCONTAINER_CLI" exec --workspace-folder . vp --version
