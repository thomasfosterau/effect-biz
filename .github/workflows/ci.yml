name: CI

# ONE job, ONE required check: the pipeline's task graph lives in
# vite.config.ts (the root `check` and `docgen` tasks and every package's
# `test:unit` / `build`), not in GitHub Actions `needs:`. Copied in shape from
# the effect-finance repository.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# No permissions by default; the single job grants only read access.
permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # A modest ceiling for every Node process in the pipeline. NODE_OPTIONS
      # is inherited by every child, including each vitest fork.
      NODE_OPTIONS: --max-old-space-size=2048
      VITEST_MAX_WORKERS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Changesets compares against the base branch.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Restore the Vite+ task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-
      # Format + lint; lint is type-aware (oxlint-tsgolint), so it runs before
      # any build against the packages' `src/` (see the packages' tsconfig).
      - name: Format and lint
        run: pnpm exec vp check
      - name: Type gates
        run: pnpm exec vp run --concurrency-limit 2 check
      - name: Unit tests
        run: pnpm exec vp run -r test:unit
      - name: Build
        run: pnpm exec vp run -r build
      # Type-checks AND runs every JSDoc @example and README block against the built dist/.
      - name: Verify documentation examples (docgen)
        run: pnpm exec vp run docgen
      - name: Audit
        run: pnpm audit --audit-level high
