name: Release

# On every push to `trunk`, changesets/action either opens the "Version
# Packages" PR or, once that has merged, publishes to npm with OIDC trusted
# publishing (no token). See docs/PUBLISHING.md.

on:
  push:
    branches: [trunk]

concurrency:
  group: release-${{ github.ref }}

permissions: {}

jobs:
  verify-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify the workflow lockfile
        run: gh actions-lock --verify

  release:
    name: Version or publish
    needs: verify-lockfile
    # Never on forks, nor for Dependabot: this job holds `id-token: write`.
    if: github.repository == 'thomasfosterau/effect-biz' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write # the version commit, tags and the Version Packages branch
      pull-requests: write # open/update the Version Packages PR
      id-token: write # npm trusted publishing, done by `pnpm publish`
    env:
      # Otherwise pnpm re-installs with scripts before the first `pnpm run`,
      # undoing --ignore-scripts below.
      pnpm_config_verify_deps_before_run: "false"
    steps:
      # The Changesets action pushes the version branch, so keep the job-scoped credentials.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # No dependency lifecycle scripts in a privileged job; the build needs no `prepare`.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          cache: false
          run-install: |
            - args: ["--frozen-lockfile", "--ignore-scripts"]
      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A PR opened with GITHUB_TOKEN triggers no workflow, so assign it here.
      - name: Assign the owner to the version PR
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
        run: gh pr edit "$PR_NUMBER" --add-assignee thomasfosterau
